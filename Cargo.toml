[package]
name = "openusage-cli"
version = "0.0.0"
edition = "2024"
description = "Local daemon and CLI for AI provider usage/quota via CrossUsage plugins"
license = "MIT"
authors = ["Kostiantyn Kushnir"]

[package.metadata.deb]
depends = "$auto"
section = "utils"
priority = "optional"
extended-description = """\
openusage-cli collects usage and quota data from AI providers via CrossUsage plugins.
It runs as a local daemon with periodic refresh and exposes normalized snapshots
through a local REST API and CLI query mode.
The query command reads from a running daemon when available and falls back
to direct local collection when no daemon is running.
Designed to be a data source for scripts, dashboards, notifications, alerts, and integrations.
"""
assets = [
    ["target/release/openusage-cli", "usr/bin/openusage-cli", "755"],
    ["vendor/crossusage/plugins/**/*", "usr/share/openusage-cli/plugins/", "644"],
    ["plugin-overrides/**/*", "usr/share/openusage-cli/plugin-overrides/", "644"],
    ["vendor/crossusage/LICENSE", "usr/share/doc/openusage-cli/CROSSUSAGE-LICENSE", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/openusage-cli", dest = "/usr/bin/openusage-cli", mode = "755" },
    { source = "vendor/crossusage/plugins/**/*", dest = "/usr/share/openusage-cli/plugins/", mode = "644" },
    { source = "plugin-overrides/**/*", dest = "/usr/share/openusage-cli/plugin-overrides/", mode = "644" },
    { source = "vendor/crossusage/LICENSE", dest = "/usr/share/licenses/openusage-cli/CROSSUSAGE-LICENSE", mode = "644" },
]

[dependencies]
aes = "0.8"
aes-gcm = "0.10.3"
anyhow = "1"
axum = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
dirs = "6"
directories = "6"
globset = "0.4"
indoc = "2"
libc = "0.2"
log = "0.4"
notify = "6"
pbkdf2 = "0.12"
regex-lite = "0.1.9"
reqwest = { version = "0.13", features = ["blocking", "socks", "json", "rustls"] }
rquickjs = { version = "0.11", features = ["bindgen"] }
rusqlite = { version = "0.41.0", default-features = false, features = ["bundled"] }
sd-notify = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
swc_core = { version = "64", features = ["common", "ecma_ast", "ecma_parser", "ecma_visit", "ecma_codegen"] }
tempfile = "3"
time = { version = "0.3.47", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
oo7 = { version = "=0.6.0", default-features = false, features = ["tokio", "native_crypto", "unstable"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
